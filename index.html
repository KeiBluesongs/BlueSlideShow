<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BlueSlideShow</title>
<style>
:root{
  --bg:#000;
  --panel:#070b12;
  --panel2:#0d1420;
  --btn:#101827;
  --border:#253246;
  --text:#dbe8ff;
  --muted:#9fb2d1;
  --accent:#4aa3ff;
  --accent2:#1b5f9e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;height:100%}
body{overflow:hidden}
body.pseudo-fullscreen .wrap{
  position:fixed;inset:0;z-index:9999;max-width:none;width:100vw;height:100dvh;
  padding:0;background:#000;border-radius:0
}
body.pseudo-fullscreen .apphead,
body.pseudo-fullscreen details.ctrlpanel,
body.pseudo-fullscreen .ctrl,
body.pseudo-fullscreen .side{
  display:none !important
}
body.pseudo-fullscreen .stage{
  flex:1;width:100vw;height:100dvh;border:none;border-radius:0
}
body.pseudo-fullscreen #status{
  opacity:.35
}
body.pseudo-fullscreen #status:hover{
  opacity:1
}
body.pseudo-fullscreen::after{
  content:"";
}
button,label,input,select{
  background:var(--btn);color:var(--text);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;font-size:16px;line-height:1.2
}
button{cursor:pointer;user-select:none}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=file]{display:none}
input[type=text],input[type=number],select{min-width:120px}
input[type=text]{flex:1;min-width:220px}
input[type=number]{width:92px}
small{color:var(--muted)}
.wrap{height:100dvh;display:flex;flex-direction:column;max-width:1180px;margin:0 auto;padding:10px;gap:10px}
.apphead{display:flex;justify-content:space-between;gap:10px;align-items:center}
.brand{font-size:20px;font-weight:700;letter-spacing:.2px;color:#dcecff}
.brand span{color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pills{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.badge{color:var(--muted);font-size:14px}
.ctrl button{flex:1;min-width:110px}
.ctrl .main{border-color:var(--accent);box-shadow:0 0 0 1px rgba(74,163,255,.22) inset}
details.ctrlpanel{border:1px solid #182235;border-radius:12px;padding:10px;background:var(--panel)}
details.ctrlpanel > summary{
  cursor:pointer;list-style:none;user-select:none;background:var(--btn);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;font-size:16px
}
details.ctrlpanel > summary::-webkit-details-marker{display:none}
details.ctrlpanel[open]{padding-bottom:12px}
.stage{
  position:relative;flex:1;min-height:240px;border:1px solid #111b2a;border-radius:14px;background:#000;
  overflow:hidden;display:flex;align-items:center;justify-content:center
}
#slide{
  max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;object-position:center;display:none;background:#000;
  transition:opacity .22s ease;
}
#empty{
  color:var(--muted);text-align:center;line-height:1.8;padding:24px
}
#status{
  position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(8px);border-radius:10px;padding:8px 10px;font-size:14px;color:#d9e8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
#progressbar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);width:0%;opacity:.9}
.side{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,360px);gap:10px;min-height:0}
#plist{
  list-style:none;padding:0;margin:0;border:1px solid #172033;border-radius:10px;overflow:auto;background:#03060a;max-height:32dvh
}
#plist li{padding:9px 11px;border-top:1px solid #121b2b;word-break:break-all;color:#cfdcf2;font-size:14px;cursor:pointer}
#plist li:first-child{border-top:none}
#plist li.curr{background:#132239;color:#fff;border-left:3px solid var(--accent)}
#plist li.hidden{display:none}
#plist li:active{transform:scale(.995)}
.help{border:1px solid #172033;border-radius:10px;padding:10px;background:#03060a;overflow:auto;max-height:32dvh;line-height:1.6}
.on{border-color:var(--accent);box-shadow:0 0 0 1px rgba(74,163,255,.28) inset}
.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#111927;border:1px solid #263248;border-radius:6px;padding:1px 5px;color:#e6f0ff}
@media (max-width: 760px){
  .wrap{padding:8px;gap:8px}
  .apphead{align-items:flex-start;flex-direction:column}
  .side{grid-template-columns:1fr}
  .help{max-height:18dvh}
  #plist{max-height:24dvh}
  button,label,input,select{font-size:15px;padding:9px 10px}
  .ctrl button{min-width:92px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="apphead">
    <div class="brand"><span>Blue</span>SlideShow</div>
    <div class="badge" id="hitBadge">未選択</div>
  </div>

  <details id="panel" class="ctrlpanel" open>
    <summary>設定（タップで開閉）</summary>

    <div class="row" style="margin-top:10px">
      <label>画像選択（複数OK）
        <input id="pickFiles" type="file" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.bmp,.avif,image/*">
      </label>
      <label>フォルダ選択
        <input id="pickFolder" type="file" multiple webkitdirectory directory accept=".jpg,.jpeg,.png,.gif,.webp,.bmp,.avif,image/*">
      </label>
      <button id="fullscreen" disabled>フルスクリーン</button>
    </div>

    <div class="row" style="margin-top:10px">
      <input id="filter" type="text" placeholder="検索（この結果だけ再生/シャッフル対象）例: 旅行 / 2024 / .jpg">
      <button id="clearFilter">クリア</button>
      <span class="pills">
        <label><input id="shuffle" type="checkbox" checked> シャッフル</label>
        <label><input id="loop" type="checkbox" checked> ループ</label>
        <label><input id="autoplay" type="checkbox"> 自動送り</label>
        <label><input id="sortPath" type="checkbox" checked> フォルダ順で整列</label>
        <label><input id="follow" type="checkbox" checked> 表示中へ追従</label>
      </span>
    </div>

    <div class="row" style="margin-top:10px">
      <label>表示間隔（秒） <input id="interval" type="number" min="1" max="3600" step="1" value="5"></label>
      <label>表示方法
        <select id="fitMode">
          <option value="contain" selected>全体表示</option>
          <option value="cover">画面いっぱい</option>
          <option value="scale-down">小さい画像は拡大しない</option>
        </select>
      </label>
      <button class="quickSec" data-sec="3">3秒</button>
      <button class="quickSec" data-sec="5">5秒</button>
      <button class="quickSec" data-sec="10">10秒</button>
      <button id="reshuffle" disabled>再シャッフル</button>
    </div>
  </details>

  <div class="row ctrl">
    <button id="play" class="main" disabled>再生/停止</button>
    <button id="prev" disabled>前へ</button>
    <button id="next" disabled>次へ</button>
    <button id="hideList">リスト表示/非表示</button>
  </div>

  <div class="stage" id="stage">
    <img id="slide" alt="BlueSlideShow slide">
    <div id="empty">画像を選択してください。<br>選択直後は自動再生しません。</div>
    <div id="status">未選択</div>
    <div id="progressbar"></div>
  </div>

  <div class="side" id="side">
    <ul id="plist"></ul>
    <div class="help">
      <small>
        <b>操作</b><br>
        <span class="kbd">Space</span> 再生/停止　<span class="kbd">←</span>/<span class="kbd">→</span> 前へ/次へ　<span class="kbd">F</span> フルスクリーン<br>
        ※画像はブラウザ内でローカル表示します。サーバーへアップロードしません。<br>
        ※GitHub Pagesで使う場合も、画像フォルダは毎回ユーザー操作で選択します。ブラウザの安全制限です。<br>
        ※iPhone/iPadではSafariの制限により、完全な全画面ではなく疑似フルスクリーン表示になる場合があります。終了は画面タップまたはEscです。
      </small>
    </div>
  </div>
</div>

<script>
(() => {
  const panel = document.getElementById('panel');
  const stage = document.getElementById('stage');
  const slide = document.getElementById('slide');
  const empty = document.getElementById('empty');
  const status = document.getElementById('status');
  const plist = document.getElementById('plist');
  const hitBadge = document.getElementById('hitBadge');
  const progressbar = document.getElementById('progressbar');
  const side = document.getElementById('side');

  const pickFiles = document.getElementById('pickFiles');
  const pickFolder = document.getElementById('pickFolder');
  const filterInput = document.getElementById('filter');
  const clearFilter = document.getElementById('clearFilter');

  const btnPlay = document.getElementById('play');
  const btnPrev = document.getElementById('prev');
  const btnNext = document.getElementById('next');
  const btnFullscreen = document.getElementById('fullscreen');
  const btnReshuffle = document.getElementById('reshuffle');
  const btnHideList = document.getElementById('hideList');

  const chkShuffle = document.getElementById('shuffle');
  const chkLoop = document.getElementById('loop');
  const chkAutoPlay = document.getElementById('autoplay');
  const chkSortPath = document.getElementById('sortPath');
  const chkFollow = document.getElementById('follow');
  const intervalInput = document.getElementById('interval');
  const fitMode = document.getElementById('fitMode');

  let files = [];
  let order = [];
  let pos = -1;
  let nowIndex = null;
  let url = null;
  let playing = false;
  let timer = null;
  let progressTimer = null;
  let startedAt = 0;
  let intervalMs = 5000;

  const imageExts = new Set(['jpg','jpeg','png','gif','webp','bmp','avif']);

  function extOf(name){
    const m = (name || '').toLowerCase().match(/\.([a-z0-9]+)$/);
    return m ? m[1] : '';
  }
  function keyLabel(f){ return (f.webkitRelativePath ? f.webkitRelativePath : f.name) || ''; }
  function keyOf(f){
    const rp = (chkSortPath.checked && f.webkitRelativePath) ? f.webkitRelativePath : f.name;
    return (rp || '').toLowerCase();
  }
  function naturalCompare(a,b){
    try { return a.localeCompare(b, 'ja', { numeric:true, sensitivity:'base' }); }
    catch(_) { return a < b ? -1 : (a > b ? 1 : 0); }
  }
  function sortFilesStable(list){ return list.slice().sort((fa,fb)=>naturalCompare(keyOf(fa), keyOf(fb))); }
  function shuffleArray(a){
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  function revoke(){ if(url){ URL.revokeObjectURL(url); url = null; } }
  function setButtons(on){
    btnPlay.disabled = !on;
    btnPrev.disabled = !on;
    btnNext.disabled = !on;
    btnFullscreen.disabled = !on;
    btnReshuffle.disabled = !on;
  }
  function closePanelOnPlay(){ if(panel) panel.open = false; }

  function readInterval(){
    const sec = Math.max(1, Math.min(3600, Number(intervalInput.value || 5)));
    intervalInput.value = String(sec);
    intervalMs = sec * 1000;
    return intervalMs;
  }

  function updateStatus(){
    const count = order.length;
    const q = (filterInput.value || '').trim();
    hitBadge.textContent = files.length ? (q ? `検索ヒット: ${count}件 / 全画像: ${files.length}件` : `全画像: ${count}件`) : '未選択';

    if(nowIndex == null){ status.textContent = '未選択'; return; }
    const name = keyLabel(files[nowIndex]);
    if(pos >= 0) status.textContent = `${pos+1}/${order.length} : ${name}`;
    else status.textContent = `キュー外: ${name} | キュー: ${order.length}件`;
  }

  function highlightCurrent(allowScroll){
    const lis = plist.querySelectorAll('li');
    lis.forEach(li=>li.classList.remove('curr'));
    if(nowIndex == null) return;
    const li = lis[nowIndex];
    if(!li) return;
    li.classList.add('curr');
    if(allowScroll && chkFollow.checked && !li.classList.contains('hidden')){
      li.scrollIntoView({block:'nearest'});
    }
  }

  function applyFilterUI(){
    const inSet = new Set(order);
    const lis = plist.querySelectorAll('li');
    lis.forEach(li=>{
      const i = Number(li.dataset.i);
      const keepNow = (nowIndex != null && i === nowIndex);
      li.classList.toggle('hidden', !(inSet.has(i) || keepNow));
    });
    highlightCurrent(true);
  }

  function renderList(){
    plist.innerHTML = '';
    files.forEach((f,i)=>{
      const li = document.createElement('li');
      li.textContent = keyLabel(f);
      li.dataset.i = String(i);
      li.addEventListener('click', ()=>{ prepareIndex(i); start(); });
      plist.appendChild(li);
    });
    applyFilterUI();
  }

  function rebuildQueue(keepCurrent=true){
    const q = (filterInput.value || '').trim().toLowerCase();
    let base = [];
    for(let i=0;i<files.length;i++){
      const label = keyLabel(files[i]).toLowerCase();
      if(!q || label.includes(q)) base.push(i);
    }
    if(chkShuffle.checked) shuffleArray(base);
    order = base;
    pos = (keepCurrent && nowIndex != null) ? order.indexOf(nowIndex) : -1;
    updateStatus();
    applyFilterUI();
  }

  function prepareIndex(fileIndex){
    if(fileIndex == null || fileIndex < 0 || fileIndex >= files.length) return;
    revoke();
    nowIndex = fileIndex;
    pos = order.indexOf(nowIndex);
    url = URL.createObjectURL(files[nowIndex]);
    slide.style.opacity = '0';
    slide.onload = () => { slide.style.opacity = '1'; };
    slide.src = url;
    slide.style.display = 'block';
    empty.style.display = 'none';
    updateStatus();
    applyFilterUI();
    resetProgress();
  }

  function next(){
    if(!order.length) return;
    if(pos < 0){ prepareIndex(order[0]); return; }
    if(pos + 1 < order.length){ prepareIndex(order[pos+1]); return; }
    if(chkLoop.checked){
      if(chkShuffle.checked){ rebuildQueue(false); }
      prepareIndex(order[0]);
      return;
    }
    stop(false);
  }

  function prev(){
    if(!order.length) return;
    if(pos < 0){ prepareIndex(order[0]); return; }
    if(pos - 1 >= 0){ prepareIndex(order[pos-1]); return; }
    if(chkLoop.checked){ prepareIndex(order[order.length-1]); }
  }

  function resetProgress(){
    progressbar.style.width = '0%';
    startedAt = Date.now();
  }

  function startProgress(){
    clearInterval(progressTimer);
    resetProgress();
    progressTimer = setInterval(()=>{
      if(!playing || !chkAutoPlay.checked){ progressbar.style.width = '0%'; return; }
      const p = Math.max(0, Math.min(100, ((Date.now() - startedAt) / intervalMs) * 100));
      progressbar.style.width = p + '%';
    }, 80);
  }

  function scheduleNext(){
    clearTimeout(timer);
    if(!playing || !chkAutoPlay.checked) return;
    readInterval();
    startedAt = Date.now();
    timer = setTimeout(()=>{
      next();
      scheduleNext();
    }, intervalMs);
  }

  function start(){
    if(!files.length) return;
    if(nowIndex == null && order.length) prepareIndex(order[0]);
    playing = true;
    closePanelOnPlay();
    btnPlay.textContent = '停止';
    readInterval();
    startProgress();
    scheduleNext();
  }

  function stop(resetText=true){
    playing = false;
    clearTimeout(timer);
    clearInterval(progressTimer);
    progressbar.style.width = '0%';
    if(resetText) btnPlay.textContent = '再生/停止';
  }

  function togglePlay(){ playing ? stop() : start(); }

  function setFiles(inputFiles){
    stop();
    revoke();
    const arr = Array.from(inputFiles || []);
    const ok = arr.filter(f=>{
      const ext = extOf(f.name);
      return imageExts.has(ext) || (f.type && f.type.startsWith('image/'));
    });
    files = sortFilesStable(ok);
    order = [];
    pos = -1;
    nowIndex = null;
    slide.removeAttribute('src');
    slide.style.display = 'none';
    empty.style.display = 'block';

    if(!files.length){
      setButtons(false);
      plist.innerHTML = '';
      hitBadge.textContent = '対応画像なし';
      status.textContent = '対応画像なし（jpg/jpeg/png/gif/webp/bmp/avif）';
      return;
    }

    setButtons(true);
    renderList();
    rebuildQueue(false);
    if(order.length) prepareIndex(order[0]);
  }

  pickFiles.addEventListener('change', e=>setFiles(e.target.files));
  pickFolder.addEventListener('change', e=>setFiles(e.target.files));

  btnPlay.addEventListener('click', togglePlay);
  btnNext.addEventListener('click', ()=>{ next(); if(playing) scheduleNext(); });
  btnPrev.addEventListener('click', ()=>{ prev(); if(playing) scheduleNext(); });
  btnReshuffle.addEventListener('click', ()=>{
    rebuildQueue(true);
    if(order.length){
      const first = (nowIndex != null && order.includes(nowIndex)) ? nowIndex : order[0];
      prepareIndex(first);
    }
    if(playing) scheduleNext();
  });

  chkShuffle.addEventListener('change', ()=>rebuildQueue(true));
  chkLoop.addEventListener('change', updateStatus);
  chkAutoPlay.addEventListener('change', ()=>{ if(playing) scheduleNext(); else progressbar.style.width='0%'; });
  intervalInput.addEventListener('change', ()=>{ readInterval(); if(playing) scheduleNext(); });
  document.querySelectorAll('.quickSec').forEach(b=>{
    b.addEventListener('click', ()=>{ intervalInput.value = b.dataset.sec; readInterval(); if(playing) scheduleNext(); });
  });

  chkSortPath.addEventListener('change', ()=>{
    if(!files.length) return;
    const keepKey = nowIndex != null ? keyLabel(files[nowIndex]) : null;
    files = sortFilesStable(files);
    if(keepKey){
      const k = files.findIndex(f=>keyLabel(f) === keepKey);
      nowIndex = k >= 0 ? k : nowIndex;
    }
    renderList();
    rebuildQueue(true);
  });

  filterInput.addEventListener('input', ()=>{
    rebuildQueue(true);
    if(order.length && (nowIndex == null || !order.includes(nowIndex))) prepareIndex(order[0]);
  });
  clearFilter.addEventListener('click', ()=>{ filterInput.value = ''; rebuildQueue(true); });
  chkFollow.addEventListener('change', ()=>highlightCurrent(true));
  fitMode.addEventListener('change', ()=>{ slide.style.objectFit = fitMode.value; });
  slide.style.objectFit = fitMode.value;

  function isPseudoFullscreen(){
    return document.body.classList.contains('pseudo-fullscreen');
  }

  function enterPseudoFullscreen(){
    document.body.classList.add('pseudo-fullscreen');
    btnFullscreen.textContent = 'フルスクリーン解除';
    try { window.scrollTo(0, 0); } catch(_) {}
  }

  function exitPseudoFullscreen(){
    document.body.classList.remove('pseudo-fullscreen');
    btnFullscreen.textContent = 'フルスクリーン';
  }

  async function toggleFullscreen(){
    const el = stage;

    if(document.fullscreenElement){
      try { await document.exitFullscreen(); } catch(_) {}
      btnFullscreen.textContent = 'フルスクリーン';
      return;
    }

    if(isPseudoFullscreen()){
      exitPseudoFullscreen();
      return;
    }

    // Mac / Windows / Androidなど、Fullscreen API対応環境では本物の全画面を試す。
    if(el.requestFullscreen && document.fullscreenEnabled !== false){
      try {
        await el.requestFullscreen();
        btnFullscreen.textContent = 'フルスクリーン解除';
        return;
      } catch(_) {
        // iPhone Safariなどで失敗した場合は疑似フルスクリーンへフォールバック。
      }
    }

    enterPseudoFullscreen();
  }

  btnFullscreen.addEventListener('click', toggleFullscreen);

  document.addEventListener('fullscreenchange', ()=>{
    if(!document.fullscreenElement && !isPseudoFullscreen()){
      btnFullscreen.textContent = 'フルスクリーン';
    }
  });

  // iPhoneの疑似フルスクリーン中は、画像エリアをタップして解除できるようにする。
  stage.addEventListener('click', ()=>{
    if(isPseudoFullscreen()) exitPseudoFullscreen();
  });

  btnHideList.addEventListener('click', ()=>{
    side.style.display = side.style.display === 'none' ? '' : 'none';
  });

  document.addEventListener('keydown', e=>{
    if(e.target && ['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
    if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
    else if(e.key === 'ArrowRight'){ next(); if(playing) scheduleNext(); }
    else if(e.key === 'ArrowLeft'){ prev(); if(playing) scheduleNext(); }
    else if(e.key.toLowerCase() === 'f'){ btnFullscreen.click(); }
    else if(e.key === 'Escape' && isPseudoFullscreen()){ exitPseudoFullscreen(); }
    else if(e.key === 'Escape' && playing){ stop(); }
  });

  window.addEventListener('beforeunload', revoke);
  readInterval();
  setButtons(false);
})();
</script>
</body>
</html>
